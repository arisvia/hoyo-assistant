name: 🚀 Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0; defaults to pyproject.toml version)'
        required: false
        default: ''

jobs:
  validate:
    name: 🔍 Lint, Typecheck & Test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 🔧 Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true

      - name: 💾 Install dependencies
        run: uv pip install -e ".[dev]"

      - name: 🧹 Format & Lint
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: 🔎 Type Check
        run: mypy src

      - name: 🧪 Run tests
        run: pytest -v --cov=hoyo_assistant --cov-report=term-missing

      - name: 📝 Verify Version & Changelog
        id: meta
        run: |
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "${RAW_TAG}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              RAW_TAG="${GITHUB_REF_NAME}"
            else
              RAW_TAG="v${PKG_VER}"
            fi
          fi
          case "${RAW_TAG}" in
            v*) TAG="${RAW_TAG}" ;;
            *) TAG="v${RAW_TAG}" ;;
          esac
          VERSION_NUM="${TAG#v}"
          if [ "${VERSION_NUM}" != "${PKG_VER}" ]; then
            echo "Error: Release tag version (${VERSION_NUM}) does not match pyproject.toml (${PKG_VER})"
            exit 1
          fi
          awk -v ver="${VERSION_NUM}" '
            index($0, "## [" ver "]") == 1 { flag=1; print; next }
            index($0, "## [") == 1 && flag { flag=0; exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Error: Release notes for ${TAG} not found or empty in CHANGELOG.md"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: 🔨 Build Packages & Binaries (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 🔧 Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true

      - name: 💾 Install Build Tools
        run: |
          uv pip install build pyinstaller
          uv pip install -e .

      - name: 📦 Build Wheel and Sdist (Linux)
        if: runner.os == 'Linux'
        run: python -m build

      - name: 🔨 Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "print('from hoyo_assistant.cli import main; main()', file=open('build_entry.py', 'w'))"
          pyinstaller --onefile --name hoyo-assistant-windows-amd64 --collect-all hoyo_assistant --add-data "src/hoyo_assistant/locales;hoyo_assistant/locales" build_entry.py
          .\dist\hoyo-assistant-windows-amd64.exe --version
          .\dist\hoyo-assistant-windows-amd64.exe --help

      - name: 🔨 Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -c "print('from hoyo_assistant.cli import main; main()', file=open('build_entry.py', 'w'))"
          pyinstaller --onefile --name hoyo-assistant-linux-amd64 --collect-all hoyo_assistant --add-data "src/hoyo_assistant/locales:hoyo_assistant/locales" build_entry.py
          ./dist/hoyo-assistant-linux-amd64 --version
          ./dist/hoyo-assistant-linux-amd64 --help

      - name: 📤 Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/*

  release:
    name: 🎉 Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 📦 Verify Assets, Generate Checksums & Extract Changelog
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          EXPECTED=4
          ACTUAL=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "${ACTUAL}" -ne "${EXPECTED}" ]; then
            echo "Error: expected ${EXPECTED} release assets, found ${ACTUAL}"
            ls -la dist
            exit 1
          fi
          cd dist && sha256sum * > checksums.txt && cd ..
          VERSION_NUM="${RELEASE_TAG#v}"
          awk -v ver="${VERSION_NUM}" '
            index($0, "## [" ver "]") == 1 { flag=1; print; next }
            index($0, "## [") == 1 && flag { flag=0; exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Error: Release notes for ${RELEASE_TAG} not found or empty in CHANGELOG.md"
            exit 1
          fi

      - name: 🎉 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "HoyoAssistant ${{ needs.validate.outputs.tag }}"
          files: dist/*
          body_path: RELEASE_NOTES.md
          make_latest: true
          generate_release_notes: false
