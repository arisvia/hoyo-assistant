[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hoyo-assistant"
version = "1.0.0"
description = "Your personal HoYoLAB/MiYoUShe daily task automation assistant"
readme = "README.md"
license = "MIT"
keywords = ["hoyolab", "miyoushe", "genshin", "honkai", "star-rail", "zzz", "automation"]
authors = [
    { name = "arisvia", email = "160387885+arisvia@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiohttp[speedups]",
    "cachetools",
    "loguru",
    "PyYAML",
    "rich",
    "segno",
    "tenacity",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-cachetools",
    "types-PyYAML",
]

[project.scripts]
hoyo-assistant = "hoyo_assistant.cli:main"
hoyo-cli = "hoyo_assistant.cli:main"

[project.urls]
Homepage = "https://github.com/arisvia/hoyo-assistant"
Repository = "https://github.com/arisvia/hoyo-assistant"
Issues = "https://github.com/arisvia/hoyo-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoyo_assistant = ["locales/*.json", "py.typed"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["segno", "segno.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=hoyo_assistant --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
